name: Render OGP image
on:
  push:
    paths:
      - 'assets/ogp.svg'
      - '.github/workflows/render-ogp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk
      - name: Render 1200x630 PNG
        run: rsvg-convert -w 1200 -h 630 assets/ogp.svg -o assets/ogp.png
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ogp.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate OGP image from Nyabit key art"
            git push
          fi
